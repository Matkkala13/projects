<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono&display=swap"
        rel="stylesheet"
        />
        <link
        href="https://fonts.googleapis.com/css2?family=Lato&family=Roboto+Mono&display=swap"
        rel="stylesheet"
        />
        <link rel="stylesheet" href="palindrome_styles.css" />
        <title>
        Palindrome checker
        </title>
    </head>

    <body>
        <div class="title">
            <h2>freeCodeCamp</h2>
        </div>
        <div class="question">
            <h1>Is it a Palindrome?</h1>
        </div>
        <div class="box">
            <label for="text-input">Enter in text to check for a palindrome:</label>
            <input id="text-input">
            <button id="check-btn">Check</button>
            <div id="result"></div>
        </div>
        <div class="text">
            A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.
        </div>

        <script src="palindrome.js"></script>
    </body>
