<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="net_cost_calc.css">
    <title>NET COST CALCULATOR</title>
  </head>
  <body>
    <div id="game">
      <div id="stats">
        <span class="stat">XP: <strong><span id="xpText">0</span></strong></span>
        <span class="stat">Health: <strong><span id="healthText">100</span></strong></span>
        <span class="stat">Gold: <strong><span id="goldText">50</span></strong></span>
      </div>
      <div id="controls">
        <button id="button1">New Recipe</button>
        <button id="button2">New Item</button>
        <button id="button3">Recipes</button>
        <button id="button4">Items</button>
        <button id="button5">Currencies</button>
      </div>
      <div id="monsterStats">
        <span class="stat">Monster Name: <strong><span id="monsterName"></span></strong></span>
        <span class="stat">Health: <strong><span id="monsterHealth"></span></strong></span>
      </div>
      <div id="text">
        Welcome to net cost calculator. 
      </div>
    </div>
    <script src="net_cost_calc.js"></script>
  </body>
</html>
