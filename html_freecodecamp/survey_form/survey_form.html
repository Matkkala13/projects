<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='utf-8'>
    <title>freeCodeCamp Survey Form</title>
    <link rel='stylesheet' href='survey_form_styles.css'>
  </head>
  <body>
    <h1 id='title'>freeCodeCamp Survey Form</h1>
    <p id='description'>Thank you for taking the time to help us improve the platform</p>
    <form id='survey-form'>
      <fieldset>
        <label for="name" id="name-label">Name <input id="name" name="first-name" type="text" placeholder='Enter your name' required /></label>
        <label for="email" id="email-label">Email <input id="email" name="email" type="email" placeholder='Enter your Email'required /></label>
        <label for="number" id="number-label">Age (optional) <input id="number" name="age" type="number" min='13' max='120' placeholder='Age' required /></label>
        <label for="dropdown" id="dropdown-label">Which option best describes your current role?
            <select id="dropdown">
                <option value="">Select current role</option>
                <option value="1">Student</option>
                <option value="2">Full Time Job</option>
                <option value="3">Full Time Learner</option>
                <option value="4">Prefer not to say</option>
                <option value="5">Other</option>
            </select>      
        </label>
      </fieldset>
      <fieldset>
        <legend>Would you recommend freeCodeCamp to a friend?</legend>
        <label for="recommend-1"><input id="recommend-1" type="radio" name="recommend" class='inline' value='definitely' checked /> Definitely</label>
        <label for="recommend-2"><input id="recommend-2" type="radio" name="recommend" class='inline' value='maybe' /> Maybe</label>
        <label for="recommend-3"><input id="recommend-3" type="radio" name="recommend" class='inline' value="not sure" /> Not sure</label>
      </fieldset>
      <fieldset>
        <label for="dropdown2" id="dropdown-label2">What is your favorite feature of freeCodeCamp?
            <select id="dropdown2">
                <option value="">Select an option</option>
                <option value="11">Challenges</option>
                <option value="22">Projects</option>
                <option value="33">Community</option>
                <option value="44">Open Source</option>
            </select>
        </label>
      </fieldset>
      <fieldset>
        <legend>What would you like to see improved? (Check all that apply)</legend>
        <label for="recommend--1"><input id="recommend--1" type="checkbox" name="recommend" class="inline" value="1" /> Front-end Projects
        </label>
        <label for="recommend--2"><input id="recommend--2" type="checkbox" name="recommend" class="inline" value="2" /> Back-end Projects
        </label>
        <label for="recommend--3"><input id="recommend--3" type="checkbox" name="recommend" class="inline" value="3"/> Data Visualization
        </label>
        <label for="recommend--4"><input id="recommend--4" type="checkbox" name="recommend" class="inline" value="4"/> Challenges
        </label>
        <label for="recommend--5"><input id="recommend--5" type="checkbox" name="recommend" class="inline" value="5"/> Open Source Community
        </label>
        <label for="recommend--6"><input id="recommend--6" type="checkbox" name="recommend" class="inline" value="6"/> Gitter help rooms
        </label>
        <label for="recommend--7"><input id="recommend--7" type="checkbox" name="recommend" class="inline" value="7"/> Videos
        </label>
        <label for="recommend--8"><input id="recommend--8" type="checkbox" name="recommend" class="inline" value="8"/> City Meetups
        </label>
        <label for="recommend--9"><input id="recommend--9" type="checkbox" name="recommend" class="inline" value="9"/> Wiki
        </label>
        <label for="recommend--10"><input id="recommend--10" type="checkbox" name="recommend" class="inline" value="10"/> Forum
        </label>
        <label for="recommend--11"><input id="recommend--11" type="checkbox" name="recommend" class="inline" value="11"/> Additional Courses
        </label>
      </fieldset>
      <fieldset>
        <label for="comments">Any comments or suggestions?
            <textarea id="comments" name="comm" rows="6" cols="50" placeholder="Enter your comment here..."></textarea>
        </label>
        <label><input id='submit' type="submit" value="Submit" /></label>
      </fieldset>
    </form>
      
  </body>
